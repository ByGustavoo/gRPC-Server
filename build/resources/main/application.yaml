logging:
  config: classpath:log4j2.xml

spring:
  application:
    name: gRPCServer

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

  grpc:
    server:
      port: 9017

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---

spring:
  config:
    activate:
      on-profile: prod

  grpc:
    server:
      port: 9027