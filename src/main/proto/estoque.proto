syntax = "proto3";

package estoque;

option java_multiple_files = true;
option java_package = "br.com.grpc.server.estoque";

service EstoqueService {
  rpc ConsultarEstoque (ConsultarEstoqueRequest) returns (ConsultarEstoqueResponse);
}

message ConsultarEstoqueRequest {
  int64 id_produto = 1;
}

message ConsultarEstoqueResponse {
  int64 id_produto = 1;
  string descricao = 2;
  int32 quantidade = 3;
  bool disponivel = 4;
}